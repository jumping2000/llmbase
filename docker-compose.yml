# =============================================================================
# LLMbase Stack
# =============================================================================
#
# Struttura directory attesa:
#   .
#   ├── docker-compose.yml
#   ├── .env                        ← credenziali (non committare!)
#   ├── config.yaml                 ← configurazione runtime llmbase
#   ├── Dockerfile                  ← llmbase (build locale)
#   ├── nginx/                      ← configurazione nginx (non committare!)
#   ├── raw/                        ← dati grezzi (non committare!)
#   └── wiki/                       ← dati conioscenza (non committare!)
#
# Avvio:   docker compose up -d
# Logs:    docker compose logs -f llmbase
# =============================================================================
# workflow CI/CD costruisce l'immagine docker ghcr.io/jumping2000/llmbase:latest
# =============================================================================
services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      llmbase:
        condition: service_healthy
    ports:
      - 5555:80
    security_opt:
      - no-new-privileges:true
    networks:
      - llmbase-net
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/default.conf.template:ro
      - ./nginx/.htpasswd:/etc/nginx/auth/.htpasswd:ro
    command: /bin/sh -c "envsubst '$MCP_API_KEY $MCP_HTTP_URL' < /etc/nginx/default.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"

  llmbase:
    image: ghcr.io/jumping2000/llmbase:latest
    restart: unless-stopped
    expose:
      - "5555"
    env_file: .env
    # user: "1000:1000"
    # environment:
    #   HOME: /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - llmbase-net
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./raw:/app/raw
      - ./wiki:/app/wiki
    healthcheck:
      test: ["CMD", "llmbase", "stats"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  llmbase-worker:
    image: ghcr.io/jumping2000/llmbase:latest
    restart: unless-stopped
    command: ["python", "-m", "llmwiki.worker_main"]
    env_file: .env
    security_opt:
      - no-new-privileges:true
    networks:
      - llmbase-net
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./raw:/app/raw
      - ./wiki:/app/wiki

  llmbase-mcp:
    image: ghcr.io/jumping2000/llmbase:latest
    restart: unless-stopped
    command: ["llmbase", "mcp"]
    env_file: .env
    expose:
      - "8100"
    security_opt:
      - no-new-privileges:true
    networks:
      - llmbase-net
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./raw:/app/raw
      - ./wiki:/app/wiki

networks:
  llmbase-net:
    driver: bridge