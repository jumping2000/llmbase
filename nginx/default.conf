events {}

http {
    resolver 127.0.0.11 ipv6=off valid=30s;

    server {
        listen 80;
        server_name _;
        client_max_body_size 20m;

        auth_basic "LLMBase";
        auth_basic_user_file /etc/nginx/custom/.htpasswd;

        location / {
            set $llmbase_upstream http://llmbase:5555;
            proxy_pass $llmbase_upstream;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward app-level bearer auth through a dedicated header.
            proxy_set_header Authorization $http_x_llmbase_authorization;
        }

        # MCP proxy: pass-through to the unified app. Auth is handled
        # by the Starlette MCPAuthMiddleware inside the container.
        location /mcp {
            auth_basic off;

            proxy_pass $llmbase_upstream;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward X-API-Key for app-level MCP auth
            proxy_set_header X-API-Key $http_x_api_key;
        }
    }
}
