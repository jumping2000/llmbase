events {}

http {
    resolver 127.0.0.11 ipv6=off valid=30s;

    server {
        listen 80;
        server_name _;

        client_max_body_size 256m;
        auth_basic "LLMBase";
        auth_basic_user_file /etc/nginx/custom/.htpasswd;

        location / {
            set $llmbase_upstream http://llmbase:5555;
            proxy_pass $llmbase_upstream;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward app-level bearer auth through a dedicated header.
            proxy_set_header Authorization $http_x_llmbase_authorization;
        }

        # MCP proxy: validate X-API-Key against the configured secret at startup
        location /mcp {
            # Disable server-level basic auth — MCP uses X-API-Key instead.
            auth_basic off;

            # Upstream is rendered at container start via envsubst.
            set $mcp_upstream ${MCP_HTTP_URL};

            # Simple header-based auth enforced at the proxy.
            if ($http_x_api_key = "") {
                return 401;
            }
            if ($http_x_api_key != "${MCP_API_KEY}") {
                return 403;
            }

            proxy_pass $mcp_upstream;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;
            proxy_buffering off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # MCP streamable HTTP requires text/event-stream in Accept
            set $mcp_accept $http_accept;
            if ($http_accept = "") {
                set $mcp_accept "application/json, text/event-stream";
            }
            proxy_set_header Accept $mcp_accept;

            # Forward app-level bearer auth via dedicated header
            proxy_set_header Authorization $http_x_llmbase_authorization;
            # Also forward the validated API key upstream for auditing if needed
            proxy_set_header X-API-Key $http_x_api_key;
        }
    }
}
