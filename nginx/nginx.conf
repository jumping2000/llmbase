events {}

http {
    resolver 127.0.0.11 ipv6=off valid=30s;

    server {
        listen 80;
        server_name _;

        client_max_body_size 256m;
        auth_basic "LLMBase";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;

        location / {
            set $llmbase_upstream http://llmbase:5555;
            proxy_pass $llmbase_upstream;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Basic Auth consumes the standard Authorization header at the proxy.
            # Forward app-level bearer auth through a dedicated header instead.
            proxy_set_header Authorization $http_x_llmbase_authorization;
        }
    }
}