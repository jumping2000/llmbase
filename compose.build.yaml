# =============================================================================
# LLMbase Stack
# =============================================================================
#
# Struttura directory attesa:
#   .
#   ├── docker-compose.yml
#   ├── .env                        ← credenziali (non committare!)
#   ├── Dockerfile                  ← llmbase (build locale)
#   ├── nginx/                      ← configurazione nginx (non committare!)
#   ├── raw/                        ← dati grezzi (non committare!)
#   └── wiki/                       ← dati conioscenza (non committare!)
#
# Avvio:   docker compose up -d
# Logs:    docker compose logs -f llmbase
# =============================================================================
services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - llmbase
    ports:
      - 5555:80
    security_opt:
      - no-new-privileges:true
    networks:
      - llmbase-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/auth/.htpasswd:ro

  llmbase:
    build: .
    restart: unless-stopped
    expose:
      - "5555"
    env_file: .env
    # user: "1000:1000"
    # environment:
    #   HOME: /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - llmbase-net
    volumes:
      - ./raw:/app/raw
      - ./wiki:/app/wiki
    healthcheck:
      test: ["CMD", "llmbase", "stats"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

networks:
  llmbase-net:
    driver: bridge